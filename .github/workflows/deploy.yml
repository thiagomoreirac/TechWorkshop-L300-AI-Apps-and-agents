name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
          docker build -t $IMAGE ./src
          docker push $IMAGE

      - name: Normalize Azure credentials
        id: azure-creds
        shell: bash
        env:
          RAW_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          
          creds = json.loads(os.environ["RAW_AZURE_CREDENTIALS"])
          
          def get_value(primary_key, fallback_key):
              return creds[primary_key] if primary_key in creds else creds.get(fallback_key)

          normalized = {
              "clientId": get_value("clientId", "appId"),
              "clientSecret": get_value("clientSecret", "password"),
              "tenantId": get_value("tenantId", "tenant"),
          }
          subscription_id = get_value("subscriptionId", "subscription")
          if subscription_id is not None:
              normalized["subscriptionId"] = subscription_id

          missing = [key for key in ("clientId", "clientSecret", "tenantId") if not normalized.get(key)]
          if missing:
              print(f"Missing required Azure credential fields after normalization: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("creds<<EOF\n")
              output.write(json.dumps(normalized))
              output.write("\nEOF\n")
          PY

      - name: Log in to Azure
        uses: azure/login@v2.1.1
        with:
          creds: ${{ steps.azure-creds.outputs.creds }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ secrets.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
          environmentVariables: >
            FOUNDRY_ENDPOINT=${{ secrets.FOUNDRY_ENDPOINT }}
            gpt_endpoint=${{ secrets.gpt_endpoint }}
            embedding_endpoint=${{ secrets.embedding_endpoint }}
            phi_4_endpoint=${{ secrets.phi_4_endpoint }}
